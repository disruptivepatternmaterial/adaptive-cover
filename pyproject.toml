[tool.poetry]
authors = ["disruptivepatternmaterial"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3",
]
description = "Adaptive Cover"
documentation = "https://github.com/disruptivepatternmaterial/adaptive-cover"
homepage = "https://github.com/disruptivepatternmaterial/adaptive-cover"
license = "MIT"
maintainers = ["disruptivepatternmaterial"]
name = "adaptive_cover"
packages = []
readme = "README.md"
repository = "https://github.com/disruptivepatternmaterial/adaptive-cover"
version = "0.3.16"

[tool.poetry.dependencies]
homeassistant = ">=2024.4.0"
python = "^3.11"

[tool.poetry.group.dev.dependencies]
hass-nabucasa = "0.75.1"
pre-commit = "4.0.1"
pre-commit-hooks = "5.0.0"
pylint = "3.3.1"
ruff = "0.9.1"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/disruptivepatternmaterial/adaptive-cover/issues"
Changelog = "https://github.com/disruptivepatternmaterial/adaptive-cover/releases"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.pylint."MESSAGES CONTROL"]
# Reasons disabled:
# format - handled by ruff
# duplicate-code - unavoidable
# used-before-assignment - false positives with TYPE_CHECKING structures
disable = [
  "format",
  "duplicate-code",
  "used-before-assignment",
]
